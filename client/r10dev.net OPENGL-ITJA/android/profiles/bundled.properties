# The release APK: client data and the server pack are inside the APK. The server list
# (servers/servers.json) offers Single Player, which runs db + auth + channel inside the app
# on 127.0.0.1, next to the remote servers.
# Build with M2_SERVER_PACK=<make-server-pack.sh out dir> tools/make_bundle.sh bundled <build>.
m2.abi=arm64-v8a,x86_64
m2.serverMode=embedded
m2.serverHost=127.0.0.1
m2.authPort=11000
m2.channelPort=11011
m2.dataBundled=true
m2.dataUrl=
m2.dataVersion=19
m2.versionName=bundled
# Kept from the first bundled builds so installed copies update in place (and keep their
# Single Player characters) instead of installing as a second app.
m2.applicationIdSuffix=.offline
m2.appLabel=Metin2
