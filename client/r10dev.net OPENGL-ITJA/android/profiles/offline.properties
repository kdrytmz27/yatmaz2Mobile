# Fully offline: db + auth + channel core run inside the app on 127.0.0.1.
# No data download; push the client data and the server pack first
# (server/tools/make-server-pack.sh + push-server-pack.sh, see docs/PORTING_DIARY.md).
m2.abi=arm64-v8a,x86_64
m2.serverMode=embedded
m2.serverHost=127.0.0.1
m2.authPort=11000
m2.channelPort=11011
m2.dataUrl=
m2.dataVersion=2
m2.versionName=offline
# Separate app: installs next to the online client instead of over it.
m2.applicationIdSuffix=.offline
m2.appLabel=Metin2 Offline
